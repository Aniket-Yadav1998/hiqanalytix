spring.application.name=contact-api
server.port=${PORT:8080}

# --------------------------------------------------------------------
# DATABASE
# By default we use a FILE-based H2 database at ./data/hiqdb.
# Data persists across restarts in the file `data/hiqdb.mv.db`.
# To switch to PostgreSQL in production, set these env vars:
#   DB_URL      = jdbc:postgresql://<host>:5432/<dbname>
#   DB_USERNAME = <user>
#   DB_PASSWORD = <password>
# and add the PostgreSQL driver dependency in pom.xml (already included).
# --------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hiqdb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}

# JPA
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson — serialize JSON responses in snake_case to match the React frontend and the FastAPI preview.
# Without this, Java fields like `moneySavingsPct` are output as camelCase and the frontend reads them as `undefined`.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Keep the H2 browser disabled unless explicitly enabled for local development.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Required to download contact data from the protected export endpoint.
# Set EXPORT_TOKEN in the environment; never commit the token.
EXPORT_TOKEN=${EXPORT_TOKEN:}

# Actuator health endpoint (optional but handy on Render)
management.endpoints.web.exposure.include=health
